<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>牧草地 面積計測</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"></script>
<script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif; color: #222; }
  #app { display: flex; flex-direction: column; height: 100%; }
  header { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: #3d5a2a; color: #fff; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .tools { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  header button { padding: 5px 10px; border-radius: 6px; border: 0; background: #fff; color: #3d5a2a; font-size: 14px; cursor: pointer; }
  #status { font-size: 12px; opacity: .85; }
  #main { flex: 1; display: flex; min-height: 0; }
  #map { flex: 1; }
  #panel { width: 360px; overflow-y: auto; border-left: 1px solid #ddd; padding: 12px 14px; background: #fafafa; font-size: 14px; }
  #panel h2 { font-size: 15px; margin: 0 0 8px; }
  .muted { color: #888; } .small { font-size: 12px; }
  a.act { color: #3d5a2a; cursor: pointer; text-decoration: underline; }
  .box { background: #fff; border: 1px solid #e3e3e3; border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; }
  .box h3 { font-size: 13px; margin: 0 0 6px; color: #3d5a2a; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .btns button { flex: 1; min-width: 130px; padding: 7px; font-size: 13px; border: 1px solid #3d5a2a; border-radius: 6px; background: #fff; color: #3d5a2a; cursor: pointer; }
  .btns button.main { background: #3d5a2a; color: #fff; }
  .mcard { background: #fff; border: 1px solid #e3e3e3; border-left: 4px solid #00b8d4; border-radius: 6px; padding: 6px 8px; margin-bottom: 8px; }
  .mcard.pending { border-left-color: #ff9800; } .mcard.local { border-left-color: #9e9e9e; }
  .mcard .mt { display: flex; justify-content: space-between; gap: 6px; font-weight: 600; }
  .mcard .num { font-size: 13px; font-variant-numeric: tabular-nums; margin: 2px 0; }
  .badge { display: inline-block; font-size: 11px; font-weight: 500; padding: 0 6px; border-radius: 8px; margin-left: 4px; vertical-align: 1px; }
  .badge.synced { background: #e0f7fa; color: #00727f; } .badge.pending { background: #fff3e0; color: #b25b00; } .badge.local { background: #eee; color: #555; }
  .area-pop table { border-collapse: collapse; font-size: 13px; }
  .area-pop th { text-align: left; font-weight: 500; color: #555; padding: 2px 10px 2px 0; white-space: nowrap; }
  .area-pop td { text-align: right; padding: 2px 0; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .area-pop .big { font-size: 15px; font-weight: 700; }
  .area-pop .warn { color: #c62828; font-size: 12px; margin-top: 4px; }
  .msg { font-size: 12px; margin-top: 6px; } .msg.ok { color: #2e7d32; } .msg.ng { color: #c62828; }
  @media (max-width: 760px) {
    #main { flex-direction: column; }
    #panel { width: 100%; height: 42%; border-left: 0; border-top: 1px solid #ddd; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>牧草地 面積計測(1m DEM)</h1>
    <span id="status"></span>
    <div class="tools">
      <button id="locate" title="現在地">現在地</button>
      <button id="reload" title="スプレッドシートから読み直す">再読み込み</button>
    </div>
  </header>
  <div id="main">
    <div id="map"></div>
    <aside id="panel"></aside>
  </div>
</div>

<script>
// ===================== 設定(ここだけ編集すればOK) =====================
const CONFIG = {
  // 計測結果の書き込み先(Apps Scriptのウェブアプリ URL)。空なら、ブラウザとローカルファイルだけに保存します
  api: 'https://script.google.com/macros/s/AKfycbxopqKbenmoQ4s1TlTkdd6bNFk66wJRMkUbw-5bXyxn1OR4ln5-gy7kLyisGaWNR9cXbw/exec',
  dem: 'data/dem.tif',                  // 面積計算に使うDEM(COG)
  demCrs: '+proj=tmerc +lat_0=44 +lon_0=142.25 +k=0.9999 +x_0=0 +y_0=0 +ellps=GRS80 +units=m +no_defs', // JGD2011 平面直角座標 XII系 (EPSG:6680)
  maxCells: 6e6,                        // 一度に計算するセル数の上限(約600ha)
  fileName: '計測範囲.geojson',          // ローカルに保存するときの既定のファイル名
};
// ======================================================================

proj4.defs('DEM', CONFIG.demCrs);
const toXY = proj4('EPSG:4326', 'DEM');

const map = L.map('map', { maxZoom: 21 }).setView([44.445, 143.17], 15);
const gsi = '<a href="https://maps.gsi.go.jp/development/ichiran.html">地理院タイル</a>';
const bases = {
  '地理院 航空写真': L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', { attribution: gsi, maxNativeZoom: 18, maxZoom: 21 }),
  '地理院 陰影起伏図': L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/hillshademap/{z}/{x}/{y}.png', { attribution: gsi, maxNativeZoom: 16, maxZoom: 21 }),
  '地理院 淡色地図': L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', { attribution: gsi, maxNativeZoom: 18, maxZoom: 21 }),
  'OpenStreetMap': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors', maxNativeZoom: 19, maxZoom: 21 }),
};
bases['地理院 航空写真'].addTo(map);
L.control.scale({ imperial: false }).addTo(map);

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nf = (v, d = 0) => Number(v).toLocaleString('ja-JP', { minimumFractionDigits: d, maximumFractionDigits: d });
const setStatus = t => document.getElementById('status').textContent = t;
const store = { get: k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
                set: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} } };
const nowStr = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 19).replace('T', ' '); };

// ===================== DEMから面積を計算 =====================
// 投影面積 = ポリゴンの平面面積、表面積 = 投影面積 × 平均(1/cosθ)
// θ はHorn法の傾斜。セル中心がポリゴン内のセルで平均する(tools/calc_area.py と同じ方法)
let demP = null;
function dem() {
  return demP ||= (async () => {
    const tiff = await GeoTIFF.fromUrl(CONFIG.dem);
    const img = await tiff.getImage();
    const [ox, oy] = img.getOrigin(), [rx, ry] = img.getResolution();
    return { img, ox, oy, dx: rx, dy: Math.abs(ry), W: img.getWidth(), H: img.getHeight(), nodata: img.getGDALNoData() };
  })().catch(e => { demP = null; throw e; });
}

// GeoJSONのPolygon/MultiPolygonを平面直角座標のリングの配列に
function ringsXY(geom) {
  const polys = geom.type === 'Polygon' ? [geom.coordinates] : geom.coordinates;
  return polys.map(p => p.map(r => r.map(c => toXY.forward([c[0], c[1]]))));
}
const ringArea = r => { let s = 0; for (let i = 0, j = r.length - 1; i < r.length; j = i++) s += (r[j][0] + r[i][0]) * (r[j][1] - r[i][1]); return Math.abs(s) / 2; };

async function calcArea(geom) {
  const D = await dem();
  const polys = ringsXY(geom), rings = polys.flat();
  const proj = polys.reduce((a, p) => a + ringArea(p[0]) - p.slice(1).reduce((b, h) => b + ringArea(h), 0), 0);
  let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
  rings.flat().forEach(([x, y]) => { minx = Math.min(minx, x); maxx = Math.max(maxx, x); miny = Math.min(miny, y); maxy = Math.max(maxy, y); });
  // 対象セル範囲(Horn法の近傍用に1セル余分に)
  const c0 = Math.floor((minx - D.ox) / D.dx) - 1, c1 = Math.ceil((maxx - D.ox) / D.dx) + 1;
  const r0 = Math.floor((D.oy - maxy) / D.dy) - 1, r1 = Math.ceil((D.oy - miny) / D.dy) + 1;
  const w = c1 - c0, h = r1 - r0;
  if (w * h > CONFIG.maxCells) throw new Error('範囲が広すぎます(約' + nf(w * h * D.dx * D.dy / 1e4) + 'ha)。もう少し小さく囲ってください');
  const z = new Float64Array(w * h).fill(NaN);
  const cc0 = Math.max(c0, 0), cc1 = Math.min(c1, D.W), rr0 = Math.max(r0, 0), rr1 = Math.min(r1, D.H);
  if (cc1 > cc0 && rr1 > rr0) {
    const [band] = await D.img.readRasters({ window: [cc0, rr0, cc1, rr1], samples: [0] });
    const ww = cc1 - cc0;
    for (let r = rr0; r < rr1; r++) for (let c = cc0; c < cc1; c++) {
      const v = band[(r - rr0) * ww + (c - cc0)];
      if (v !== D.nodata && Number.isFinite(v)) z[(r - r0) * w + (c - c0)] = v;
    }
  }
  // 行ごとにセル中心の高さでポリゴンとの交点を求め、内側のセルを塗る(偶奇規則で穴にも対応)
  let n = 0, nOk = 0, sumSec = 0, sumDeg = 0;
  const Z = (r, c) => z[r * w + c];
  for (let r = 1; r < h - 1; r++) {
    const y = D.oy - (r0 + r + 0.5) * D.dy, xs = [];
    for (const ring of rings) for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const [xi, yi] = ring[i], [xj, yj] = ring[j];
      if ((yi > y) !== (yj > y)) xs.push(xi + (y - yi) / (yj - yi) * (xj - xi));
    }
    xs.sort((a, b) => a - b);
    for (let k = 0; k + 1 < xs.length; k += 2) {
      const ca = Math.max(1, Math.ceil((xs[k] - D.ox) / D.dx - 0.5) - c0);
      const cb = Math.min(w - 2, Math.floor((xs[k + 1] - D.ox) / D.dx - 0.5) - c0);
      for (let c = ca; c <= cb; c++) {
        n++;
        const a = Z(r-1,c-1), b = Z(r-1,c), cc = Z(r-1,c+1), d = Z(r,c-1), f = Z(r,c+1), g = Z(r+1,c-1), hh = Z(r+1,c), ii = Z(r+1,c+1);
        const gx = ((cc + 2*f + ii) - (a + 2*d + g)) / (8 * D.dx);
        const gy = ((g + 2*hh + ii) - (a + 2*b + cc)) / (8 * D.dy);
        const s = Math.sqrt(1 + gx*gx + gy*gy);
        if (Number.isFinite(s)) { nOk++; sumSec += s; sumDeg += Math.acos(1 / s) * 180 / Math.PI; }
      }
    }
  }
  if (!nOk) return { proj, surf: NaN, ratio: NaN, slope: NaN, coverage: 0, cells: n };
  const m = sumSec / nOk;
  return { proj, surf: proj * m, ratio: m, slope: sumDeg / nOk, coverage: nOk / n, cells: n };
}

function areaHtml(a, title) {
  const row = (k, m2, big) => `<tr><th>${k}</th><td class="${big ? 'big' : ''}">${nf(m2)} m²</td></tr>
    <tr><th></th><td class="muted">${nf(m2 / 100, 1)} a / ${nf(m2 / 1e4, 3)} ha</td></tr>`;
  return `<div class="area-pop">${title ? `<b>${esc(title)}</b>` : ''}<table>
    ${row('投影面積', a.proj, false)}
    ${Number.isFinite(a.surf) ? row('表面積', a.surf, true) +
      `<tr><th>面積比</th><td>${a.ratio.toFixed(4)}(+${nf((a.ratio - 1) * 100, 2)}%)</td></tr>
       <tr><th>平均傾斜</th><td>${a.slope.toFixed(1)}°</td></tr>` : '<tr><td colspan="2" class="warn">DEMの範囲外です</td></tr>'}
    </table>${a.coverage > 0 && a.coverage < 0.999 ? `<div class="warn">DEMが無い部分が ${nf((1 - a.coverage) * 100, 1)}% あります(その部分は平均傾斜で補っています)</div>` : ''}</div>`;
}

// DEMの範囲を点線で表示し、最初はその範囲を表示する
const demFrame = L.rectangle([[0, 0], [0, 0]], { color: '#ffeb3b', weight: 2, dashArray: '6 6', fill: false, interactive: false });
dem().then(D => {
  const inv = proj4('DEM', 'EPSG:4326');
  const xs = [D.ox, D.ox + D.W * D.dx], ys = [D.oy - D.H * D.dy, D.oy];
  const ll = xs.flatMap(x => ys.map(y => inv.forward([x, y]))).map(([lng, lat]) => [lat, lng]);
  demFrame.setBounds(L.latLngBounds(ll)).addTo(map);
  if (!drawn.getLayers().length) map.fitBounds(demFrame.getBounds());
}).catch(e => setStatus('DEMを読み込めません:' + e.message));

// ===================== 計測 =====================
// 1件の計測 = 地図上のポリゴン1つ。状態(st)は
//   synced  … スプレッドシートに保存済み
//   pending … まだシートに送れていない(合言葉未入力・通信失敗など)
//   local   … ローカルファイルから読み込んだだけで、シートには無い
const drawn = new L.FeatureGroup().addTo(map);
const shapeStyle = { color: '#00e5ff', weight: 3, fillColor: '#00e5ff', fillOpacity: 0.15 };
L.drawLocal.draw.toolbar.buttons.polygon = '範囲を囲って面積を計算';
L.drawLocal.draw.toolbar.buttons.rectangle = '四角で囲って面積を計算';
L.drawLocal.draw.toolbar.actions.text = 'やめる';
L.drawLocal.draw.toolbar.finish.text = '完了';
L.drawLocal.draw.toolbar.undo.text = '1点戻す';
L.drawLocal.draw.handlers.polygon.tooltip = { start: 'クリックして頂点を置きます', cont: '続けて頂点を置きます', end: '最初の点をクリック(または「完了」)で閉じます' };
L.drawLocal.draw.handlers.rectangle.tooltip.start = 'ドラッグして四角を描きます';
L.drawLocal.draw.handlers.simpleshape.tooltip.end = '離すと確定します';
L.drawLocal.edit.toolbar.buttons = { edit: '計測範囲を修正', editDisabled: '修正できる範囲がありません', remove: '計測範囲を削除', removeDisabled: '削除できる範囲がありません' };
L.drawLocal.edit.toolbar.actions = { save: { title: '確定', text: '確定' }, cancel: { title: 'やめる', text: 'やめる' }, clearAll: { title: 'すべて削除', text: 'すべて削除' } };
map.addControl(new L.Control.Draw({
  position: 'topleft',
  draw: { polygon: { allowIntersection: false, showArea: false, shapeOptions: shapeStyle },
          rectangle: { showArea: false, shapeOptions: shapeStyle },
          polyline: false, circle: false, marker: false, circlemarker: false },
  edit: { featureGroup: drawn },
}));
L.control.layers(bases, { '計測範囲': drawn, 'DEMの範囲': demFrame }).addTo(map);

const byMid = new Map();   // 計測ID → layer
const newId = () => 'M' + nowStr().replace(/\D/g, '').slice(2, 14) + '-' + Math.random().toString(36).slice(2, 5);
const title = l => l.name || '(名前なし)';
const round7 = c => typeof c[0] === 'number' ? [+c[0].toFixed(7), +c[1].toFixed(7)] : c.map(round7);
const geomOf = l => { const g = l.toGeoJSON(false).geometry; g.coordinates = round7(g.coordinates); return g; };
const BADGE = { synced: 'シート保存済', pending: '未送信', local: 'ローカルのみ' };

function popupHtml(l) {
  return (l.area ? areaHtml(l.area, title(l)) : `<b>${esc(title(l))}</b><div class="small">計算中…</div>`) +
    (l.memo ? `<div class="small" style="margin-top:4px;white-space:pre-wrap">${esc(l.memo)}</div>` : '') +
    `<div class="small muted" style="margin-top:4px">${esc(l.created || '')}${l.who ? ' ・ ' + esc(l.who) : ''}<span class="badge ${l.st}">${BADGE[l.st]}</span></div>
     <div class="small" style="margin-top:4px"><a class="act" data-act="name">名前・メモ</a>${l.st !== 'synced' && CONFIG.api ? ' ・ <a class="act" data-act="send">シートに送る</a>' : ''}</div>`;
}
function addLayer(geom, p) {
  const l = L.polygon(L.GeoJSON.coordsToLatLngs(geom.coordinates, geom.type === 'Polygon' ? 1 : 2), shapeStyle);
  Object.assign(l, { mid: p.mid || newId(), name: p.name || '', memo: p.memo || '', created: p.created || nowStr(),
                     who: p.who || '', area: p.area || null, st: p.st || 'pending' });
  l.bindPopup(() => popupHtml(l), { minWidth: 220 });
  l.bindTooltip(() => `${esc(title(l))}:${l.area ? nf(l.area.surf || l.area.proj) + ' m²' : ''}`, { sticky: true });
  drawn.addLayer(l); byMid.set(l.mid, l);
  return l;
}
const removeLayer = l => { drawn.removeLayer(l); byMid.delete(l.mid); };
const refreshPopup = l => { if (l.isPopupOpen()) l.setPopupContent(popupHtml(l)); };

let popLayer = null;
map.on('popupopen', e => popLayer = e.popup._source);
document.getElementById('map').addEventListener('click', e => {
  const a = e.target.closest('.leaflet-popup-content [data-act]');
  if (!a || !popLayer || !drawn.hasLayer(popLayer)) return;
  if (a.dataset.act === 'name') rename(popLayer);
  if (a.dataset.act === 'send') send(popLayer);
});

async function recalc(l) {
  try { l.area = await calcArea(geomOf(l)); }
  catch (e) { l.area = null; setStatus('計算できませんでした:' + e.message); }
}

// 新しく囲ったとき:面積を計算 → 名前を聞く → シートとローカルに保存
map.on(L.Draw.Event.CREATED, async e => {
  const l = addLayer(e.layer.toGeoJSON(false).geometry, { who: store.get('editor') });
  l.openPopup();
  await recalc(l); refreshPopup(l);
  const name = prompt('この計測の名前(例:北側の採草地)。あとで変更できます', '');
  if (name) l.name = name.trim();
  refreshPopup(l);
  await send(l, true);
});
map.on(L.Draw.Event.EDITED, async e => {
  for (const l of e.layers.getLayers()) { await recalc(l); l.st = l.st === 'local' ? 'local' : 'pending'; refreshPopup(l); await send(l, true); }
});
map.on(L.Draw.Event.DELETED, async e => {
  for (const l of e.layers.getLayers()) { byMid.delete(l.mid); if (l.st === 'synced') await removeRemote(l.mid); }
  changed();
});

function rename(l) {
  const name = prompt('名前', l.name); if (name === null) return;
  const memo = prompt('メモ(空欄でも可)', l.memo); if (memo === null) return;
  l.name = name.trim(); l.memo = memo.trim();
  if (l.st === 'synced') l.st = 'pending';
  refreshPopup(l); send(l, true);
}

// 何か変わったら:ブラウザ内の控え・ローカルファイル・一覧を更新
function toFC() {
  return { type: 'FeatureCollection', features: [...byMid.values()].sort((a, b) => a.created.localeCompare(b.created)).map(l => {
    const a = l.area || {};
    return { type: 'Feature', geometry: geomOf(l), properties: {
      計測ID: l.mid, 名前: l.name, メモ: l.memo, 作成日時: l.created, 更新者: l.who, 状態: l.st,
      投影面積_m2: +(+a.proj || 0).toFixed(1), 表面積_m2: +(+a.surf || 0).toFixed(1),
      面積比: +(+a.ratio || 0).toFixed(4), 平均傾斜_度: +(+a.slope || 0).toFixed(2), DEM被覆率: +(+a.coverage || 0).toFixed(3) } };
  }) };
}
function changed() {
  store.set('rf2-cache', JSON.stringify(toFC()));
  autoSaveFile();
  render();
}

// ===================== スプレッドシート =====================
const api = (q = '') => CONFIG.api + (CONFIG.api.includes('?') ? '&' : '?') + q;
async function postApi(body) {
  let pass = store.get('passcode');
  if (!pass) { pass = prompt('入力用の合言葉を入れてください(この端末に記憶されます)'); if (!pass) throw new Error('合言葉が入力されませんでした'); }
  const res = await fetch(CONFIG.api, { method: 'POST', body: JSON.stringify({ ...body, target: 'measure', passcode: pass }) });
  const j = await res.json();
  if (!j.ok) {
    if (j.error === 'passcode') { store.set('passcode', ''); throw new Error('合言葉が違います'); }
    throw new Error(j.error);
  }
  store.set('passcode', pass);
  return j;
}
async function send(l, quiet) {
  if (!CONFIG.api) { changed(); return; }
  try {
    let who = store.get('editor');
    if (!who) { who = prompt('計測者の名前を入れてください(この端末に記憶されます)') || ''; if (!who) throw new Error('計測者が入力されませんでした'); store.set('editor', who); }
    if (!l.who) l.who = who;
    if (!l.area) await recalc(l);
    const a = l.area || {};
    const c = l.getBounds().getCenter();
    await postApi({ op: 'save', 計測ID: l.mid, 名前: l.name, メモ: l.memo, 作成日時: l.created, 計測者: l.who, 更新者: who,
      投影面積_m2: +(+a.proj || 0).toFixed(1), 表面積_m2: +(+a.surf || 0).toFixed(1), 面積比: +(+a.ratio || 0).toFixed(4),
      平均傾斜_度: +(+a.slope || 0).toFixed(2), DEM被覆率: +(+a.coverage || 0).toFixed(3),
      中心緯度: +c.lat.toFixed(7), 中心経度: +c.lng.toFixed(7), geometry: JSON.stringify(geomOf(l)) });
    l.st = 'synced';
    setStatus(`「${title(l)}」をシートに保存しました`);
  } catch (e) {
    if (l.st === 'synced') l.st = 'pending';
    setStatus('シートに保存できませんでした:' + e.message + '(一覧の「シートに送る」で再送できます)');
    if (!quiet) alert('シートに保存できませんでした:' + e.message);
  }
  refreshPopup(l); changed();
}
async function removeRemote(mid) {
  if (!CONFIG.api) return;
  try { await postApi({ op: 'delete', 計測ID: mid }); setStatus('シートから削除しました'); }
  catch (e) { setStatus('シートから削除できませんでした:' + e.message); }
}

// シートの内容 + まだ送れていない手元の計測 を合わせて表示する
async function loadSheet() {
  if (!CONFIG.api) return;
  setStatus('シートを読み込み中…');
  try {
    const r = await fetch(api('target=measure&t=' + Date.now())), text = await r.text();
    let j; try { j = JSON.parse(text); } catch { throw new Error('APIがJSON以外を返しました(Apps Scriptのデプロイ設定を確認)'); }
    if (!j.ok) throw new Error(j.error);
    const remote = new Set();
    j.rows.forEach(row => {
      const mid = String(row['計測ID'] || ''); if (!mid || !row.geometry) return;
      remote.add(mid);
      let g; try { g = JSON.parse(row.geometry); } catch { return; }
      const old = byMid.get(mid);
      if (old && old.st !== 'synced') return;           // 手元で変更中のものは手元を優先
      if (old) removeLayer(old);
      const n = k => row[k] === '' || row[k] == null ? NaN : +row[k];
      addLayer(g, { mid, name: row['名前'], memo: row['メモ'], created: String(row['作成日時'] || ''), who: row['計測者'], st: 'synced',
        area: { proj: n('投影面積_m2'), surf: n('表面積_m2'), ratio: n('面積比'), slope: n('平均傾斜_度'), coverage: n('DEM被覆率') } });
    });
    // シートに無くなった「保存済み」は、他の人が削除したものなので外す
    [...byMid.values()].filter(l => l.st === 'synced' && !remote.has(l.mid)).forEach(removeLayer);
    setStatus(`シートの計測 ${remote.size} 件`);
  } catch (e) { setStatus('シートを読み込めませんでした:' + e.message); }
  changed();
}

// ===================== ローカルのGeoJSONファイル =====================
// Chrome・Edge:一度ファイルを選ぶと、以後は変更のたびに自動で上書きし、次回起動時にそのファイルを読み込める
// それ以外のブラウザ:ダウンロード/ファイル選択で保存・読み込み
const FS = 'showSaveFilePicker' in window;
const idb = (mode, val) => new Promise((res, rej) => {
  const o = indexedDB.open('richfield2', 1);
  o.onupgradeneeded = () => o.result.createObjectStore('kv');
  o.onerror = () => rej(o.error);
  o.onsuccess = () => {
    const st = o.result.transaction('kv', mode).objectStore('kv');
    const q = mode === 'readwrite' ? (val ? st.put(val, 'file') : st.delete('file')) : st.get('file');
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  };
});
let fileHandle = null, fileReady = false;   // fileReady = 書き込み許可がある
const fileOpts = { types: [{ description: 'GeoJSON', accept: { 'application/geo+json': ['.geojson', '.json'] } }] };

async function writeFile() {
  const w = await fileHandle.createWritable();
  await w.write(JSON.stringify(toFC(), null, 1)); await w.close();
}
let saving = Promise.resolve();
function autoSaveFile() {   // 書き込みが重ならないように順番に行う
  if (!fileHandle || !fileReady) return;
  saving = saving.then(writeFile).catch(() => { fileReady = false; render(); });
}
async function chooseSaveFile() {
  if (!FS) { download(); return; }
  try {
    fileHandle = await showSaveFilePicker({ suggestedName: CONFIG.fileName, ...fileOpts });
    await idb('readwrite', fileHandle); fileReady = true;
    await writeFile(); setStatus(`「${fileHandle.name}」に保存しました(以後は自動で上書き)`);
  } catch (e) { if (e.name !== 'AbortError') alert('保存できませんでした:' + e.message); }
  render();
}
async function openFile() {
  if (!FS) { document.getElementById('fileIn').click(); return; }
  try {
    const [h] = await showOpenFilePicker(fileOpts);
    fileHandle = h; await idb('readwrite', h);
    fileReady = (await h.requestPermission({ mode: 'readwrite' })) === 'granted';
    mergeFile(JSON.parse(await (await h.getFile()).text()));
  } catch (e) { if (e.name !== 'AbortError') alert('読み込めませんでした:' + e.message); }
  render();
}
async function reopenFile() {   // 前回のファイルを読み込む(ボタンを押したときに許可を求める)
  try {
    fileReady = (await fileHandle.requestPermission({ mode: 'readwrite' })) === 'granted';
    if (!fileReady) return;
    mergeFile(JSON.parse(await (await fileHandle.getFile()).text()));
  } catch (e) { alert('前回のファイルを開けませんでした:' + e.message); fileHandle = null; await idb('readwrite', null); }
  render();
}
async function forgetFile() { fileHandle = null; fileReady = false; await idb('readwrite', null); render(); }
function download() {
  const blob = new Blob([JSON.stringify(toFC(), null, 1)], { type: 'application/geo+json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `計測範囲_${nowStr().slice(0, 10)}.geojson`; a.click();
}
// ファイルの計測のうち、まだ地図に無いものを追加(シートに無ければ「ローカルのみ」)
function mergeFile(g) {
  const feats = (g.type === 'FeatureCollection' ? g.features : [g]).filter(f => f?.geometry && /^(Multi)?Polygon$/.test(f.geometry.type));
  let n = 0;
  feats.forEach(f => {
    const p = f.properties || {}, mid = p['計測ID'] || p.mid;
    if (mid && byMid.has(mid)) return;
    const l = addLayer(f.geometry, { mid, name: p['名前'] || p.name || '', memo: p['メモ'] || p.memo || '', created: p['作成日時'] || p.created,
                                     who: p['更新者'] || p['計測者'] || '', st: 'local' });
    recalc(l).then(() => { refreshPopup(l); changed(); });
    n++;
  });
  setStatus(`ファイルから ${n} 件を追加しました(すでに表示中の ${feats.length - n} 件は省略)`);
  if (drawn.getLayers().length) map.fitBounds(drawn.getBounds(), { maxZoom: 18, padding: [30, 30] });
  changed();
}

// ===================== 右パネル(計測一覧) =====================
function render() {
  const ls = [...byMid.values()].sort((a, b) => b.created.localeCompare(a.created));
  const sum = ls.reduce((t, l) => t + (l.area?.surf || 0), 0);
  const nPend = ls.filter(l => l.st !== 'synced').length;
  const fileBox = FS ? (fileHandle
      ? `<div class="small">保存先:<b>${esc(fileHandle.name)}</b> ${fileReady ? '(変更のたびに自動で上書き)' : '<span style="color:#b25b00">(このあと許可が必要)</span>'}</div>
         <div class="btns" style="margin-top:6px">${fileReady ? '' : '<button class="main" id="fReopen">前回のファイルを読み込む</button>'}
           <button id="fOpen">別のファイルを開く</button><button id="fSave">別の名前で保存</button></div>
         <div class="small" style="margin-top:4px"><a class="act" id="fForget">このファイルの自動保存をやめる</a></div>`
      : `<div class="btns"><button class="main" id="fSave">ローカルに保存</button><button id="fOpen">ファイルを開く</button></div>
         <div class="small muted" style="margin-top:4px">保存先を一度選ぶと、以後は自動で上書きされ、次回この画面を開いたときに読み込めます。</div>`)
    : `<div class="btns"><button class="main" id="fSave">GeoJSONをダウンロード</button><button id="fOpen">ファイルを開く</button></div>
       <div class="small muted" style="margin-top:4px">このブラウザでは自動上書きができません(Chrome・Edgeで使えます)。</div>`;
  const panel = document.getElementById('panel');
  panel.innerHTML = `
    <div class="box"><h3>使い方</h3><div class="small">左上の<b>五角形</b>(または四角)ボタンで範囲を囲むと、1m DEMから<b>投影面積・表面積</b>を計算します。
      計測は${CONFIG.api ? 'スプレッドシートに保存され、ほかの端末でも見られます' : 'このブラウザに保存されます'}。修正は鉛筆、削除はゴミ箱ボタン。黄色の点線が計算できる範囲です。</div></div>
    <div class="box"><h3>ローカルのGeoJSONファイル</h3>${fileBox}
      <input type="file" id="fileIn" accept=".geojson,.json,application/geo+json" style="display:none"></div>
    <h2>計測一覧(${ls.length}件)${nPend && CONFIG.api ? ` <span class="badge pending">未送信 ${nPend}</span>` : ''}</h2>
    ${nPend && CONFIG.api ? '<div class="btns" style="margin-bottom:8px"><button id="sendAll">未送信をまとめてシートに送る</button></div>' : ''}
    ${ls.length ? ls.map(l => `
      <div class="mcard ${l.st}" data-mid="${esc(l.mid)}">
        <div class="mt"><a class="act" data-act="go">${esc(title(l))}</a><span class="muted small">${esc(l.created.slice(0, 16))}</span></div>
        <div class="num">${l.area && Number.isFinite(l.area.surf) ? `表面積 <b>${nf(l.area.surf)} m²</b>(${nf(l.area.surf / 1e4, 3)} ha)<br>投影 ${nf(l.area.proj)} m² ・ 傾斜 ${l.area.slope.toFixed(1)}°` : '<span class="muted">計算中…</span>'}</div>
        ${l.memo ? `<div class="small" style="white-space:pre-wrap">${esc(l.memo)}</div>` : ''}
        <div class="small">${l.who ? esc(l.who) + ' ' : ''}<span class="badge ${l.st}">${BADGE[l.st]}</span></div>
        <div class="small" style="margin-top:2px"><a class="act" data-act="name">名前・メモ</a>${l.st !== 'synced' && CONFIG.api ? ' ・ <a class="act" data-act="send">シートに送る</a>' : ''} ・ <a class="act" data-act="del">削除</a></div>
      </div>`).join('') : '<p class="muted">まだ計測がありません。</p>'}
    ${ls.length > 1 ? `<p class="small">合計 表面積 ${nf(sum)} m²(${nf(sum / 1e4, 3)} ha)</p>` : ''}`;
  const $ = id => document.getElementById(id), on = (id, f) => { if ($(id)) $(id).onclick = f; };
  on('fSave', chooseSaveFile); on('fOpen', openFile); on('fReopen', reopenFile); on('fForget', forgetFile);
  $('fileIn').onchange = async e => { const f = e.target.files[0]; if (f) mergeFile(JSON.parse(await f.text())); };
  on('sendAll', async () => { for (const l of [...byMid.values()].filter(l => l.st !== 'synced')) await send(l, true); });
  panel.querySelectorAll('.mcard [data-act]').forEach(a => a.onclick = async () => {
    const l = byMid.get(a.closest('.mcard').dataset.mid); if (!l) return;
    const act = a.dataset.act;
    if (act === 'go') { map.fitBounds(l.getBounds(), { maxZoom: 18, padding: [40, 40] }); l.openPopup(); }
    if (act === 'name') rename(l);
    if (act === 'send') send(l);
    if (act === 'del' && confirm(`「${title(l)}」を削除しますか?` + (l.st === 'synced' ? '(シートからも削除されます)' : ''))) {
      removeLayer(l); if (l.st === 'synced') await removeRemote(l.mid); changed();
    }
  });
}

// ===================== 起動 =====================
(async () => {
  // 1) ブラウザ内の控え(前回の状態。未送信のものも含む)
  try { const c = JSON.parse(store.get('rf2-cache') || 'null'); if (c) c.features.forEach(f => {
    const p = f.properties, n = k => +p[k];
    addLayer(f.geometry, { mid: p['計測ID'], name: p['名前'], memo: p['メモ'], created: p['作成日時'], who: p['更新者'], st: p['状態'] || 'pending',
      area: { proj: n('投影面積_m2'), surf: n('表面積_m2'), ratio: n('面積比'), slope: n('平均傾斜_度'), coverage: n('DEM被覆率') } }); }); } catch {}
  // 2) 前回のローカルファイル(許可済みならそのまま読み込む)
  if (FS) try {
    fileHandle = (await idb('readonly')) || null;
    if (fileHandle && (await fileHandle.queryPermission({ mode: 'readwrite' })) === 'granted') {
      fileReady = true; mergeFile(JSON.parse(await (await fileHandle.getFile()).text()));
    }
  } catch { fileHandle = null; }
  render();
  // 3) スプレッドシート
  await loadSheet();
  if (drawn.getLayers().length) map.fitBounds(drawn.getBounds(), { maxZoom: 17, padding: [30, 30] });
})();

document.getElementById('reload').onclick = loadSheet;
let here = null;
document.getElementById('locate').onclick = () => map.locate({ setView: true, maxZoom: 18 });
map.on('locationfound', e => { if (here) here.remove(); here = L.circleMarker(e.latlng, { radius: 8, color: '#fff', weight: 2, fillColor: '#1e88e5', fillOpacity: 1 }).addTo(map); });
map.on('locationerror', () => alert('現在地を取得できませんでした(位置情報の許可を確認してください)'));
</script>
</body>
